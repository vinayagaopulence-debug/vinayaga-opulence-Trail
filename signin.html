<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Vinayaga Opulence</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .signin-page {
            max-width: 500px;
            margin: 70px auto;
            padding: 40px;
            text-align: center;
        }

        .signin-page h1 {
            color: #4b0055;
            font-family: Georgia, serif;
            margin-bottom: 30px;
        }

        .signin-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .signin-form input {
            padding: 14px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .signin-form button {
            padding: 14px;
            background: #4b0055;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .signin-form button:hover {
            background: #35003d;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">

        <div class="header-top">

            <div class="brand-logo">
                <img src="images/logo.png" alt="Vinayaga Opulence">
            </div>

        </div>

        <nav class="main-navigation">
            <a href="index.html">HOME</a>
            <a href="gold.html">GOLD</a>
            <a href="silver.html">SILVER</a>
            <a href="contact.html">CONTACT</a>
        </nav>

    </header>


    <!-- SIGN IN -->
    <main>

        <section class="signin-page">

            <h1>Sign In</h1>

            <form class="signin-form">

                <input type="email"
                       placeholder="Email Address"
                       required>

                <input type="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    SIGN IN
                </button>

            </form>

        </section>

    </main>


</body>
</html>
